default:
  model: gemini-2.5-flash
  prompt_text: |
    You are a medical image segmentation assistant. Return a JSON list of objects with fields:
    - label: the structure name
    - box_2d: bounding box [y0, x0, y1, x1] scaled 0-1000
    - mask: base64 PNG for the object mask within the bounding box
  temperature: 0.5
  thinking_budget: 0

polyp:
  model: gemini-2.5-flash
  prompt_text: |
    Give the segmentation masks for colorectal polyp. Output a JSON list of segmentation masks where each entry contains the 2D bounding box in the key "box_2d", the segmentation mask in key "mask", and the text label in the key "label". Use descriptive labels.
  temperature: 0.5
  thinking_budget: 0

optic_disc_cup:
  model: gemini-2.5-flash
  prompt_text: |
    Give the segmentation masks for the optic disc and the optic cup in this retinal fundus image. Output a JSON list of two segmentation masks. One entry should have the label "optic disc" and the other "optic cup". Each entry must contain the 2D bounding box in "box_2d", the segmentation mask in "mask", and the text label in "label".
  temperature: 0.5
  thinking_budget: 0

polyp_hybrid_v1:
  model: gemini-2.5-flash
  prompt_text: |
    Hybrid Referring Expression: Segment the colorectal polyp described in the image and any accompanying referring expression. Output a JSON list of segmentation masks where each entry contains the 2D bounding box in the key "box_2d", the segmentation mask in key "mask", and the text label in the key "label". Use descriptive labels for polyps such as "colorectal polyp" when present.
  temperature: 0.5
  thinking_budget: 0

optic_disc_cup_hybrid_v1:
  model: gemini-2.5-flash
  prompt_text: |
    Hybrid Referring Expression: Segment the optic disc and optic cup described in the image and any accompanying referring expressions. Output a JSON list of segmentation masks where each entry contains the 2D bounding box in the key "box_2d", the segmentation mask in key "mask", and the text label in the key "label". Use the labels "optic disc" and "optic cup" for the respective structures.
  temperature: 0.5
  thinking_budget: 0

derm_lesion:
